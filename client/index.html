<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="A local ffmpeg GUI. Drop a file in, pick an operation, get a file out."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/switzer-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/switzer-500.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/commit-mono-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Scrub</title>
    <script>
      // Before first paint, not after. Reading the stored theme once the bundle
      // has loaded means a dark-mode user gets a flash of the light palette
      // first, which is the one thing a theme switch must never do.
      try {
        var t = localStorage.getItem('scrub:theme');
        if (t === 'light' || t === 'dark' || t === 'phosphor')
          document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        /* storage refused; the media query still applies */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
